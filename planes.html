<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes de Entrenamiento | Claudia Trainer</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="planes.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="shop-header">
        <div class="header-top">
            <div class="header-top-inner">
                <a href="index.html" class="brand-logo">CLAUDIA.TRAINER</a>
                <nav class="main-nav">
                    <a href="index.html">Inicio</a>
                    <a href="productos.html">Tienda</a>
                    <a href="planes.html" class="active">Planes</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="planes-container">
        <section class="reels-section">
            <h2 class="section-title">Descubre nuestros <span>planes</span> en acción</h2>

            <div class="carousel-wrapper">
                <button class="arrow arrow-prev" id="prevBtn" aria-label="Anterior">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>
                <button class="arrow arrow-next" id="nextBtn" aria-label="Siguiente">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </button>

                <div class="carousel-track-outer">
                    <div class="carousel-track" id="carouselTrack">
                    </div>
                </div>

                <div class="product-card-container" id="productCardContainer">
                </div>

                <div class="dots" id="dots"></div>
            </div>
        </section>
    </main>

    <script src="js/carrito.js"></script>
    <script src="js/planes.js"></script>
</body>

</html>
